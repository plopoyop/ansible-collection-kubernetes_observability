---
# Grafana ne renvoie la clé qu'à la création : on ne (re)crée le token que si
# le Secret manque ou si le token a expiré, sinon le run reste idempotent.
- name: "Compute token settings for {{ _grafana_sa.name }}"
  ansible.builtin.set_fact:
    _grafana_sa_token_name: "{{ _grafana_sa.token.name | default(_grafana_sa.token.secret_name) }}"
    _grafana_sa_token_namespace: "{{ _grafana_sa.token.secret_namespace | default(grafana_namespace) }}"
    _grafana_sa_token_key: "{{ _grafana_sa.token.secret_key | default('token') }}"

- name: "Read token Secret {{ _grafana_sa.token.secret_name }}"
  kubernetes.core.k8s_info:
    api_version: "v1"
    kind: "Secret"
    name: "{{ _grafana_sa.token.secret_name }}"
    namespace: "{{ _grafana_sa_token_namespace }}"
  register: _grafana_sa_token_secret
  no_log: true

# Compte créé en dry-run : pas d'id, rien à lire côté API.
- name: "List tokens of service account {{ _grafana_sa.name }}"
  ansible.builtin.uri:
    url: "{{ grafana_api_url }}/api/serviceaccounts/{{ _grafana_sa_id }}/tokens"
    method: "GET"
    url_username: "{{ grafana_admin_user }}"
    url_password: "{{ grafana_admin_password }}"
    force_basic_auth: true
    validate_certs: "{{ grafana_api_validate_certs }}"
    status_code: [200]
  register: _grafana_sa_tokens
  check_mode: false
  when: _grafana_sa_id | string | length > 0

- name: "Compute token state for {{ _grafana_sa.name }}"
  ansible.builtin.set_fact:
    _grafana_sa_token_current: "{{ (_grafana_sa_tokens.json | default([])) | selectattr('name', 'equalto', _grafana_sa_token_name) | first | default({}) }}"
    _grafana_sa_token_secret_ok: >-
      {{ _grafana_sa_token_secret.resources | length > 0
         and _grafana_sa_token_key in (_grafana_sa_token_secret.resources[0].data | default({})) }}

- name: "Compute token renewal for {{ _grafana_sa.name }}"
  ansible.builtin.set_fact:
    _grafana_sa_token_renew: >-
      {{ not (_grafana_sa_token_secret_ok | bool)
         or _grafana_sa_token_current | length == 0
         or (_grafana_sa_token_current.hasExpired | default(false)) }}

- name: "Delete stale token {{ _grafana_sa_token_name }}"
  ansible.builtin.uri:
    url: "{{ grafana_api_url }}/api/serviceaccounts/{{ _grafana_sa_id }}/tokens/{{ _grafana_sa_token_current.id }}"
    method: "DELETE"
    url_username: "{{ grafana_admin_user }}"
    url_password: "{{ grafana_admin_password }}"
    force_basic_auth: true
    validate_certs: "{{ grafana_api_validate_certs }}"
    status_code: [200]
  changed_when: true
  when:
    - _grafana_sa_token_renew | bool
    - _grafana_sa_token_current | length > 0

- name: "Create token {{ _grafana_sa_token_name }}"
  ansible.builtin.uri:
    url: "{{ grafana_api_url }}/api/serviceaccounts/{{ _grafana_sa_id }}/tokens"
    method: "POST"
    url_username: "{{ grafana_admin_user }}"
    url_password: "{{ grafana_admin_password }}"
    force_basic_auth: true
    validate_certs: "{{ grafana_api_validate_certs }}"
    body_format: "json"
    body:
      name: "{{ _grafana_sa_token_name }}"
      secondsToLive: "{{ _grafana_sa.token.seconds_to_live | default(0) | int }}"
    status_code: [200]
  register: _grafana_sa_token_created
  changed_when: true
  no_log: true
  when:
    - _grafana_sa_token_renew | bool
    - _grafana_sa_id | string | length > 0

- name: "Store token in Secret {{ _grafana_sa.token.secret_name }}"
  kubernetes.core.k8s:
    state: "present"
    definition:
      apiVersion: "v1"
      kind: "Secret"
      type: "Opaque"
      metadata:
        name: "{{ _grafana_sa.token.secret_name }}"
        namespace: "{{ _grafana_sa_token_namespace }}"
        labels:
          app.kubernetes.io/managed-by: "ansible"
          app.kubernetes.io/part-of: "grafana"
        annotations:
          grafana.com/service-account: "{{ _grafana_sa.name }}"
      stringData: "{{ {_grafana_sa_token_key: _grafana_sa_token_created.json.key} }}"
  no_log: true
  when: _grafana_sa_token_created.json.key is defined
  tags:
    - "manifest"
