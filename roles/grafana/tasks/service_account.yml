---
# API en basic auth admin : uri ne supporte pas le check mode, les lectures
# forcent `check_mode: false`, les écritures sont donc sautées en dry-run.
- name: "Search service account {{ _grafana_sa.name }}"
  ansible.builtin.uri:
    url: "{{ grafana_api_url }}/api/serviceaccounts/search?perpage=1000&query={{ _grafana_sa.name | urlencode }}"
    method: "GET"
    url_username: "{{ grafana_admin_user }}"
    url_password: "{{ grafana_admin_password }}"
    force_basic_auth: true
    validate_certs: "{{ grafana_api_validate_certs }}"
    status_code: [200]
  register: _grafana_sa_search
  check_mode: false

- name: "Compute service account state {{ _grafana_sa.name }}"
  ansible.builtin.set_fact:
    _grafana_sa_current: "{{ _grafana_sa_search.json.serviceAccounts | selectattr('name', 'equalto', _grafana_sa.name) | first | default({}) }}"

- name: "Create service account {{ _grafana_sa.name }}"
  ansible.builtin.uri:
    url: "{{ grafana_api_url }}/api/serviceaccounts"
    method: "POST"
    url_username: "{{ grafana_admin_user }}"
    url_password: "{{ grafana_admin_password }}"
    force_basic_auth: true
    validate_certs: "{{ grafana_api_validate_certs }}"
    body_format: "json"
    body:
      name: "{{ _grafana_sa.name }}"
      role: "{{ _grafana_sa_role }}"
      isDisabled: false
    status_code: [201]
  register: _grafana_sa_created
  changed_when: true
  when:
    - _grafana_sa_state == "present"
    - _grafana_sa_current | length == 0

- name: "Update service account role {{ _grafana_sa.name }}"
  ansible.builtin.uri:
    url: "{{ grafana_api_url }}/api/serviceaccounts/{{ _grafana_sa_current.id }}"
    method: "PATCH"
    url_username: "{{ grafana_admin_user }}"
    url_password: "{{ grafana_admin_password }}"
    force_basic_auth: true
    validate_certs: "{{ grafana_api_validate_certs }}"
    body_format: "json"
    body:
      role: "{{ _grafana_sa_role }}"
    status_code: [200]
  changed_when: true
  when:
    - _grafana_sa_state == "present"
    - _grafana_sa_current | length > 0
    - _grafana_sa_current.role != _grafana_sa_role

- name: "Delete service account {{ _grafana_sa.name }}"
  ansible.builtin.uri:
    url: "{{ grafana_api_url }}/api/serviceaccounts/{{ _grafana_sa_current.id }}"
    method: "DELETE"
    url_username: "{{ grafana_admin_user }}"
    url_password: "{{ grafana_admin_password }}"
    force_basic_auth: true
    validate_certs: "{{ grafana_api_validate_certs }}"
    status_code: [200]
  changed_when: true
  when:
    - _grafana_sa_state == "absent"
    - _grafana_sa_current | length > 0

- name: "Remove token Secret of service account {{ _grafana_sa.name }}"
  kubernetes.core.k8s:
    api_version: "v1"
    kind: "Secret"
    name: "{{ _grafana_sa.token.secret_name }}"
    namespace: "{{ _grafana_sa.token.secret_namespace | default(grafana_namespace) }}"
    state: "absent"
  when:
    - _grafana_sa_state == "absent"
    - _grafana_sa.token is defined
  tags:
    - "manifest"

- name: "Include token management for {{ _grafana_sa.name }}"
  ansible.builtin.include_tasks:
    file: "service_account_token.yml"
    apply:
      tags:
        - "grafana"
        - "grafana_service_accounts"
        - "install"
  vars:
    _grafana_sa_id: "{{ _grafana_sa_created.json.id if _grafana_sa_created is changed else _grafana_sa_current.id | default('') }}"
  when:
    - _grafana_sa_state == "present"
    - _grafana_sa.token is defined
  tags: ["always"]
