---
- name: "Check Grafana API settings"
  ansible.builtin.assert:
    that:
      - grafana_api_url | length > 0
      - grafana_admin_password is defined
    fail_msg: "grafana_api_url (or an enabled ingress) and grafana_admin_password are required to manage service accounts."
    quiet: true

- name: "Check service account names are unique"
  ansible.builtin.assert:
    that:
      - _grafana_service_accounts | map(attribute='name') | unique | length == _grafana_service_accounts | length
      - not grafana_mcp_enabled or grafana_mcp_service_account_name not in (grafana_service_accounts | map(attribute='name') | list)
    fail_msg: "Duplicate names in grafana_service_accounts (grafana_mcp_service_account_name is reserved when grafana_mcp_enabled)."
    quiet: true

- name: "Wait for Grafana API"
  ansible.builtin.uri:
    url: "{{ grafana_api_url }}/api/health"
    method: "GET"
    validate_certs: "{{ grafana_api_validate_certs }}"
    status_code: [200]
  register: _grafana_api_health
  until: _grafana_api_health.status == 200
  retries: 30
  delay: 10
  check_mode: false

- name: "Manage Grafana service account"
  ansible.builtin.include_tasks:
    file: "service_account.yml"
    apply:
      tags:
        - "grafana"
        - "grafana_service_accounts"
        - "install"
  vars:
    _grafana_sa_state: "{{ _grafana_sa.state | default('present') }}"
    _grafana_sa_role: "{{ _grafana_sa.role | default('Viewer') }}"
  loop: "{{ _grafana_service_accounts }}"
  loop_control:
    loop_var: "_grafana_sa"
    label: "{{ _grafana_sa.name }}"
  tags: ["always"]
