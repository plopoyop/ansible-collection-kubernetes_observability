---
- name: "Pre-check: VMSingle CRD installed"
  kubernetes.core.k8s_info:
    api_version: "apiextensions.k8s.io/v1"
    kind: "CustomResourceDefinition"
    name: "vmsingles.operator.victoriametrics.com"
  register: vmoperator_vmsingle_crd
  check_mode: false
  failed_when: not ansible_check_mode and (vmoperator_vmsingle_crd.resources | length == 0)
  tags:
    - "preflight"

- name: "Create namespace for VMSingle CR"
  kubernetes.core.k8s:
    name: "{{ vmoperator_vmsingle_namespace }}"
    api_version: "v1"
    kind: "Namespace"
    state: "present"
  tags:
    - "namespace"

# CRD absente en check mode signifie : l'opérateur n'est pas installé sur ce
# cluster (state actuel) — on ne tente pas l'apply pour éviter une erreur
# de validation côté kube-apiserver.
- name: "Apply VMSingle CR"
  kubernetes.core.k8s:
    state: "present"
    apply: true
    definition: >-
      {{
        (lookup('ansible.builtin.template', 'vmsingle_cr.yml.j2') | ansible.builtin.from_yaml)
        | ansible.builtin.combine({'spec': vmoperator_vmsingle_extra_spec}, recursive=True)
      }}
  when: vmoperator_vmsingle_crd.resources | length > 0
  tags:
    - "custom_resource"
